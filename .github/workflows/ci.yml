name: Java CI con Gradle - Christian Donoso

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew clean test

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Reporte de Pruebas
          path: build/test-results/test/*.xml
          reporter: java-junit